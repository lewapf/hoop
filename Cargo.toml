[package]
name = "hoop"
version = "0.2.0"
edition = "2024"
description = "Make and preview machine embroidery designs"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
png = "0.17"
resvg = { version = "0.48", default-features = false }
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ttf-parser = "0.25"
usvg = "0.48.1"

[profile.release]
lto = "thin"
strip = true
