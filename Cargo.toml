[package]
name = "hoop"
version = "0.1.0"
edition = "2024"
description = "Preview embroidery files on Janome hoops"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
png = "0.17"
rfd = "0.17"
ttf-parser = "0.25"
usvg = "0.48.1"

[profile.release]
lto = "thin"
strip = true
